# Published reference numbers used to check the evaluation harness against known results.
#
# Every value was read from the cited source on 2026-11-15. Rates are percentages.
# `family` is the task name inside the benchmark. `settings` lists run settings that must
# match for a measured result to be comparable; scores move a lot when they differ.
#
# Carnegie Mellon business-task suite: default (unadapted) harness, test split (60% of each
# task), three runs per configuration, OpenHands software-agent-sdk.
# BrowseComp-Plus: authors' search agent, top 5 results per search cut to 512 tokens,
# gpt-4.1 as judge. The paper does not report step limits, temperature, number of runs or
# variance, so treat these as loose references.

references:
