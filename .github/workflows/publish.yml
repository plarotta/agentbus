name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify and publish (for example, v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: verify and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        # v9 uses immutable release tags; pin the official v9.0.0 commit.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install project
        run: uv sync --extra dev --extra all

      - name: Verify source
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy agentbus
          uv run pytest tests/ -q --tb=short

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from agentbus import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag ($RELEASE_TAG) must be v$PACKAGE_VERSION"
            exit 1
          }

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentbus-graph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
