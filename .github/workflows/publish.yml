name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: verify and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev --extra all

      - name: Verify source
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy agentbus
          uv run pytest tests/ -q --tb=short

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from agentbus import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag ($RELEASE_TAG) must be v$PACKAGE_VERSION"
            exit 1
          }

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentbus-graph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
